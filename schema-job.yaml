apiVersion: batch/v1
kind: Job
metadata:
  name: schema-load
spec:
  backoffLimit: 2          # retry at most twice on failure
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:15-alpine   # provides the psql client
          command: ["sh", "-c"]
          args:
            - >-
              export PGPASSWORD="$DB_PASSWORD" &&
              psql -h "$DB_HOST" -U "$DB_USER" -d "$DB_NAME" -p 5432 -f /sql/schema.sql
          env:
            - name: PGSSLMODE
              value: "require"
            - name: DB_HOST
              valueFrom: { secretKeyRef: { name: db-credentials, key: host } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: db-credentials, key: username } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: db-credentials, key: dbname } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: db-credentials, key: password } }
          volumeMounts:
            - name: schema
              mountPath: /sql
      volumes:
        - name: schema
          configMap:
            name: schema-sql
