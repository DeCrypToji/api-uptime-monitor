name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      
      - name: Run Go tests
        run: go test ./... -v
        working-directory: ./
      
      - name: Build Go binary
        run: go build -o api-uptime-monitor .
        working-directory: ./
      
      - name: Check Go formatting
        run: gofmt -l . | grep -v vendor && exit 1 || true
        working-directory: ./

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      
      - name: Build React app
        run: npm run build
        working-directory: ./frontend

  docker:
    runs-on: ubuntu-latest
    needs: backend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./
          push: false
          tags: api-uptime-monitor:latest
