name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run Go tests
        run: go test ./... -v
      - name: Build Go binary
        run: go build -o api-uptime-monitor .
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" && echo "$unformatted" && exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Build React app
        run: npm run build
        working-directory: ./frontend

  vuln-reachable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Reachability vulnerability scan (BLOCKING)
        run: govulncheck ./...
        # No continue-on-error: reachable vulns MUST fail the pipeline

  scan-image:
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t api-uptime-monitor:scan .
      - name: Trivy image scan (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-uptime-monitor:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
