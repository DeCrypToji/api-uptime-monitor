name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'
      
      - name: Run Go tests
        run: go test ./... -v
        working-directory: ./
      
      - name: Build Go binary
        run: go build -o api-uptime-monitor .
        working-directory: ./
      
      - name: Check Go formatting
        run: gofmt -l . | grep -v vendor && exit 1 || true
        working-directory: ./

  frontend:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      
      - name: Build React app
        run: npm run build
        working-directory: ./frontend

  docker:
    runs-on: ubuntu-latest
    needs: backend
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./
          push: false
          tags: api-uptime-monitor:latest

  scan-image:
    runs-on: ubuntu-latest
    needs: backend                    # only scan if the code builds
    steps:
      - uses: actions/checkout@v4

      - name: Build image for scanning
        run: docker build -t api-uptime-monitor:scan .

      - name: Trivy image scan (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-uptime-monitor:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'   # only care about serious
          ignore-unfixed: true        # don't block on CVEs with no fix available
          exit-code: '1'              # FAIL the build if any match — fail-closed