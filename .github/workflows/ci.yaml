name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run Go tests
        run: go test ./... -v
      - name: Build Go binary
        run: go build -o api-uptime-monitor .
      - name: Check Go formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:" && echo "$unformatted" && exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Build React app
        run: npm run build
        working-directory: ./frontend

  vuln-reachable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Reachability vulnerability scan
        run: |
          # Run govulncheck and capture output
          set +e
          govulncheck ./... 2>&1 | tee /tmp/vulncheck.txt
          VULN_EXIT=$?
          set -e

          # If govulncheck passed, we're done
          if [ $VULN_EXIT -eq 0 ]; then
            echo "✅ No reachable vulnerabilities"
            exit 0
          fi

          # govulncheck failed — check if ALL findings are unfixable (Fixed in: N/A)
          FIXABLE=$(grep "Fixed in:" /tmp/vulncheck.txt | grep -v "N/A" | wc -l)

          if [ "$FIXABLE" -eq 0 ]; then
            echo "⚠️ Reachable vulnerabilities found but ALL are unfixable (no patch available)"
            echo "Documented risk acceptance — see lib/pq migration in backlog"
            cat /tmp/vulncheck.txt
            exit 0
          else
            echo "❌ Fixable reachable vulnerabilities found — blocking"
            cat /tmp/vulncheck.txt
            exit 1
          fi
  scan-image:
    runs-on: ubuntu-latest
    needs: backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build image for scanning
        run: docker build -t api-uptime-monitor:scan .
      - name: Trivy image scan (informational)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-uptime-monitor:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  lint-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git secrets scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

  sast-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run gosec (SAST)
        run: gosec ./...

  scan-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan (IaC)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './infra'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          trivyignores: 'infra/.trivyignore'
  
  deploy:
    runs-on: ubuntu-latest
    needs: [backend, vuln-reachable, lint-docker, secrets-scan, sast-go]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write    # required for OIDC token request
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/api-uptime-monitor-backend:$IMAGE_TAG .
          docker push $ECR_REGISTRY/api-uptime-monitor-backend:$IMAGE_TAG

      - name: Update config repo with new image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          CONFIG_PAT: ${{ secrets.CONFIG_REPO_PAT }}
        run: |
          git clone https://x-access-token:${CONFIG_PAT}@github.com/DeCrypToji/api-uptime-monitor-config.git config-repo
          cd config-repo
          sed -i "s|image: .*api-uptime-monitor-backend:.*|image: 119750096239.dkr.ecr.us-east-1.amazonaws.com/api-uptime-monitor-backend:${IMAGE_TAG}|g" k8s/backend-deploy.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/backend-deploy.yaml
          git diff --cached --quiet || (git commit -m "deploy: update image to ${IMAGE_TAG}" && git push)   